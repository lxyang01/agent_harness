upstream billguard {
    ip_hash;
    # 失败记忆:10s 内连错 2 次即把该实例摘除 10s,故障期间请求免付连接超时
    server web-1:8001 max_fails=2 fail_timeout=10s;
    server web-2:8002 max_fails=2 fail_timeout=10s;
}
server {
    listen 80;
    location / {
        proxy_pass http://billguard;
        # 实例连接失败或明确 502/503 时立刻换下一实例重试(kill web-1 演练零感知)
        proxy_next_upstream error timeout http_502 http_503;
        # $http_host 原样透传浏览器 Host(含端口;$host 会剥掉端口,导致
        # web 层 Origin/Referer 与 Host 的 netloc 同源校验误拒合法跨端口访问)
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
