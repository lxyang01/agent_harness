[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "billguard"
version = "1.0.0"
description = "Auditable personal bill & subscription guardian Agent Harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.29,<2",
]

[project.optional-dependencies]
dev = [
  "PyYAML>=6.0,<7",
]

[project.scripts]
billguard-web = "billguard.web:main"
billguard-mcp = "billguard.mcp_servers.bill_server:main"
work-item-mcp = "billguard.mcp_servers.work_item_server:main"
billguard-eval = "billguard.eval:main"
billguard-live-eval = "billguard.live_eval:main"
billguard-adversarial-eval = "billguard.adversarial_eval:main"

[tool.setuptools.packages.find]
include = ["billguard*"]

[tool.setuptools.package-data]
billguard = ["web_static/*"]
