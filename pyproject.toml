[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "feedback-agent-runtime"
version = "0.3.0"
description = "Auditable customer-feedback Agent Harness with Skills and MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.29,<2",
]

[project.optional-dependencies]
dev = [
  "PyYAML>=6.0,<7",
]

[project.scripts]
feedback-agent-web = "minimal_agent.web:main"
feedback-data-mcp = "minimal_agent.mcp_servers.feedback_server:main"
work-item-mcp = "minimal_agent.mcp_servers.work_item_server:main"
feedback-agent-eval = "minimal_agent.eval:main"
feedback-agent-live-eval = "minimal_agent.live_eval:main"
feedback-agent-adversarial-eval = "minimal_agent.adversarial_eval:main"

[tool.setuptools.packages.find]
include = ["minimal_agent*"]

[tool.setuptools.package-data]
minimal_agent = ["web_static/*"]
