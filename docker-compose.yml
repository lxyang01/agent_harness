services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: billguard
      POSTGRES_PASSWORD: billguard
      POSTGRES_DB: billguard
    ports: ["127.0.0.1:5433:5432"]   # 宿主机测试直连
    # 注意:不再挂载 init.sql。空库由 POSTGRES_DB 创建,schema 全部交给
    # migrations/ 目录 + billguard.migrate(见下方 BILLGUARD_AUTO_MIGRATE);
    # 存量 pgdata 卷(旧 init.sql 建过表)下次启动会被 V001 自动补账 ——
    # V001 全程 IF NOT EXISTS,重放幂等,只新增 schema_migrations 记录。
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billguard"]
      interval: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 10

  bill-server:
    build: {context: ., dockerfile: docker/Dockerfile}
    command: ["-m", "billguard.mcp_servers.bill_server",
              "--data-dir", "/data/bills",
              "--transport", "streamable-http",
              "--host", "0.0.0.0",
              "--port", "8010"]
    environment: &web_env
      BILLGUARD_PG_DSN: postgresql://billguard:billguard@postgres:5432/billguard
      BILLGUARD_REDIS_URL: redis://redis:6379/0
      # schema 启动门禁的自动模式:web/MCP/users 的 PG 入口建池后发现落后于
      # migrations/ 时先自动应用再放行(新 pgdata 卷零手工步骤自迁移;
      # bill-server/work-item-server 经 *web_env 锚点共享同一行为)
      BILLGUARD_AUTO_MIGRATE: "1"
      # API Key 透传:web 启动仅检查变量存在;用户在 .env 里写 API_KEY 即可
      # (OPENROUTER_API_KEY 同样有效,API_KEY 优先)。占位值只落在
      # OPENROUTER_API_KEY,OPENAI_API_KEY 缺省留空——llm.py 优先读
      # OPENAI_API_KEY,若它带占位值会遮住真实 Key(空串为 falsy,正确落穿)。
      OPENROUTER_API_KEY: ${API_KEY:-${OPENROUTER_API_KEY:-e2e-smoke-key}}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes: [billdata:/data]
    # serve() 启动即连 MCP,慢启动曾致容器永久退出;unless-stopped 自动重启
    # (compose kill/stop 属手动停止,不受重启策略影响,冒烟 A3/B3 流程不变)
    restart: unless-stopped
    # /health 就绪路由(mcp_servers/bill_server.py custom_route):HTTP 200 才算
    # 存活,取代仅证明 TCP 栈在线的 socket 探针
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3)"]
      interval: 5s
      retries: 10
      start_period: 10s

  work-item-server:
    build: {context: ., dockerfile: docker/Dockerfile}
    command: ["-m", "billguard.mcp_servers.work_item_server",
              "--data-dir", "/data/work-items", "serve",
              "--transport", "streamable-http",
              "--host", "0.0.0.0",
              "--port", "8020"]
    environment: *web_env
    volumes: [billdata:/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/health', timeout=3)"]
      interval: 5s
      retries: 10
      start_period: 10s

  web-1: &web
    build: {context: ., dockerfile: docker/Dockerfile}
    # 模型端点默认 OpenRouter(与 OPENROUTER_API_KEY 透传配套);用 OpenAI 官方
    # Key 时在宿主机 export BILLGUARD_LLM_BASE_URL/BILLGUARD_LLM_MODEL 后 up -d
    command: ["-m", "billguard.web", "--host", "0.0.0.0", "--port", "8001",
              "--base-url", "${BILLGUARD_LLM_BASE_URL:-https://openrouter.ai/api/v1}",
              "--model", "${BILLGUARD_LLM_MODEL:-openai/gpt-4.1-mini}"]
    environment:
      <<: *web_env
      BILLGUARD_BILL_MCP_URL: http://bill-server:8010/mcp
      BILLGUARD_WORK_ITEM_MCP_URL: http://work-item-server:8020/mcp
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    # web-2 经 <<: *web 继承同一重启策略:MCP 慢启动致退出时自动重试
    restart: unless-stopped
    # 镜像是 python:3.13-slim(无 curl),用 urllib 打自身 /api/health;
    # 端口各不相同(8001/8002),web-2 必须覆写继承自锚点的本条健康检查
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health', timeout=3)"]
      interval: 5s
      retries: 10
      start_period: 30s

  web-2:
    <<: *web
    command: ["-m", "billguard.web", "--host", "0.0.0.0", "--port", "8002",
              "--base-url", "${BILLGUARD_LLM_BASE_URL:-https://openrouter.ai/api/v1}",
              "--model", "${BILLGUARD_LLM_MODEL:-openai/gpt-4.1-mini}"]
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/api/health', timeout=3)"]
      interval: 5s
      retries: 10
      start_period: 30s

  nginx:
    image: nginx:alpine
    ports: ["8080:80"]
    volumes: ["./docker/nginx.conf:/etc/nginx/conf.d/default.conf"]
    depends_on: [web-1, web-2]

volumes:
  pgdata:
  billdata:
